name: Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-deployment.yml
    with:
      stage: development
      source_ref: ${{ github.sha }}

  deploy:
    needs: build
    permissions:
      id-token: write
    uses: ./.github/workflows/deploy-stack.yml
    with:
      stage: development
      artifact_id: ${{ needs.build.outputs.artifact_id }}
