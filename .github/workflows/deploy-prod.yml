name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed release tag (vX.Y.Z)
        type: string
        required: true
      enable_canary:
        description: Enable CodeDeploy canary rollout
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-deployment.yml
    with:
      stage: production
      source_ref: ${{ inputs.release_tag }}
      enable_canary: ${{ inputs.enable_canary }}

  deploy:
    needs: build
    permissions:
      id-token: write
    uses: ./.github/workflows/deploy-stack.yml
    with:
      stage: production
      artifact_id: ${{ needs.build.outputs.artifact_id }}
